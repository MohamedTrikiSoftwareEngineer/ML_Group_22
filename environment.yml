name: ml_group_22
channels:
  - conda-forge
  - defaults
dependencies:
  # Python 3.11 is what the four notebooks were developed and tested on (3.11.0).
  - python=3.11
  - pip
  - pip:
    # Same pins as requirements.txt, so conda and pip give the same environment.
    # pandas 3.x is excluded on purpose: it is a breaking major release.
    - pandas>=2.3.3,<3.0
    - numpy>=2.3.5,<3.0
    - matplotlib>=3.10.0,<4.0
    - seaborn>=0.13.2,<0.14
    - scikit-learn>=1.8.0,<2.0
    - joblib>=1.5.3,<2.0
    - scipy>=1.16.3,<2.0
    - jupyter>=1.1.1
    - ipykernel>=7.3.0
